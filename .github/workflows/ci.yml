name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.11.2'
          enable-cache: true
      - name: Check patch whitespace
        run: git show --format= --check HEAD
      - name: Install locked environment
        run: uv sync --locked --extra mlflow
      - name: Check Python
        run: |
          uv run --locked --extra mlflow ruff check .
          uv run --locked --extra mlflow ruff format --check .
          uv run --locked --extra mlflow pytest
