[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wor-chain-dle-gpt"
version = "0.1.0"
description = "Train a Wor🔗dle solving model from scratch"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
mlflow = ["mlflow-skinny==3.18.0"]

[project.scripts]
wcd-check-tracking = "wor_chain_dle_gpt.tracking.check:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
